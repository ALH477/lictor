[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lictor"
dynamic = ["version"]
description = "An autolith-style terminal agent for Exsecutor, driven by the local Claude Code binary"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.153",
]

[project.scripts]
lictor = "lictor.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.version]
path = "lictor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lictor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# The env scrub in main() must run before any import that reaches
# claude_agent_sdk, so lictor-local imports are deliberately deferred to
# after it rather than sitting at module level.
"lictor/__main__.py" = ["E402"]
